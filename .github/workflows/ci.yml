name: CI/CD Pipeline

on:
  # Feature branches too: a pushed feat/* branch, and a PR stacked on one (for
  # example feat/backend onto feat/ui-overhaul), gets the same checks as main.
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop, 'feat/**']

env:
  NODE_VERSION: '22'
  # Postgres service of the jobs that need data (see `services: postgres` below).
  # The build reads the category list and route ids from it; the integration tests wipe the test database.
  DATABASE_URL: postgresql://lego:lego@localhost:5432/lego_store
  DATABASE_URL_TEST: postgresql://lego:lego@localhost:5432/lego_store_test
  # CI-only credentials for the seeded admin (no real data lives here).
  ADMIN_EMAIL: admin@ci.lego-store.local
  ADMIN_PASSWORD: ci-admin-password
  # `next start` (e2e prod project, Lighthouse, bundle size) outside Vercel:
  # let Auth.js trust the request's host. AUTH_SECRET is generated per job.
  AUTH_TRUST_HOST: 'true'

jobs:
  # Lint and Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

  # Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego
          POSTGRES_DB: lego_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_store"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prepare the databases (dev + integration test)
        run: |
          psql postgresql://lego:lego@localhost:5432/lego_store -c 'CREATE DATABASE lego_store_test'
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright Chromium (Storybook browser tests)
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test -- --run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

  # Build
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego
          POSTGRES_DB: lego_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_store"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # End-to-end tests (Playwright: dev server projects + the production project)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego
          POSTGRES_DB: lego_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_store"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Checkout against real Stripe TEST mode (e2e/stripe-live, playwright.stripe-live.config.ts).
  # Optional: runs only when the repository has the secrets STRIPE_SECRET_KEY (sk_test_),
  # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (pk_test_) and STRIPE_WEBHOOK_SECRET; otherwise every
  # step is skipped and the job passes. Forks never receive secrets.
  e2e-stripe-live:
    name: E2E vs Stripe test mode (optional)
    runs-on: ubuntu-latest
    needs: build
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego
          POSTGRES_DB: lego_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_store"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Stripe secrets present?
        id: stripe
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" ] && [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Stripe test secrets not configured: skipping."
          fi

      - name: Checkout code
        if: steps.stripe.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.stripe.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate a throwaway AUTH_SECRET
        if: steps.stripe.outputs.enabled == 'true'
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies, migrate and seed
        if: steps.stripe.outputs.enabled == 'true'
        run: |
          npm ci
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright Chromium
        if: steps.stripe.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run the Stripe test-mode checkout
        if: steps.stripe.outputs.enabled == 'true'
        run: npm run test:e2e:stripe

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure() && steps.stripe.outputs.enabled == 'true'
        with:
          name: playwright-report-stripe-live
          path: playwright-report/
          retention-days: 7

  # Lighthouse Performance Audit (on PRs only)
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego
          POSTGRES_DB: lego_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_store"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build application
        run: npm run build

      # Category scores gate (lighthouserc.json); reports are kept as workflow
      # artifacts, never published to public storage. SEO is asserted only on
      # indexable pages: /cart is noindex on purpose. /checkout is left out: with
      # an empty cart it redirects to /cart; e2e/checkout.spec.ts audits it with axe.
      # Performance stays a warning: local medians sit at 0.80-0.82 (Oct 2026), too
      # close to the 0.8 line for a runner's noise; make it an error once they clear it
      # comfortably.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: false
          configPath: ./lighthouserc.json

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate on what ships: production dependencies.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Report-only for tooling. Known: GHSA-vfj7-8cjw-p6xm (braces, via
      # eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch),
      # dev-only with no non-breaking fix yet; revisit when eslint-config-next updates.
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

  # Bundle Size Check (scripts/first-load-js.mjs)
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lego
          POSTGRES_PASSWORD: lego
          POSTGRES_DB: lego_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lego -d lego_store"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed the database
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build application
        run: npm run build

      # First-load JS per key route (gzip, modern browsers) against a budget.
      - name: Check first-load JS budget
        run: |
          npm run start -- -p 3311 &
          npm run size -- http://localhost:3311

# Local Postgres for development and tests (see README, "Puesta en marcha local del backend").
# One server, two databases: lego_store (dev, `npm run dev`) and
# lego_store_test (Vitest integration tests, wiped on every run).
# The host port defaults to 5433 so it never clashes with a native Postgres on 5432.
# No fixed container_name: compose names it <project>-db-1 (the project is the
# checkout's folder), so a second checkout or worktree can run its own database
# beside this one on another POSTGRES_PORT. Use `docker compose exec db ...`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: lego
      POSTGRES_DB: lego_store
      TEST_DATABASE: lego_store_test
    ports:
      # Loopback only: the example credentials must not be reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lego-store-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lego -d lego_store && psql -U lego -d lego_store_test -c 'select 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  lego-store-pgdata:
